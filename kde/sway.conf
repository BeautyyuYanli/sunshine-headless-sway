# Standalone config: never include the distribution's systemd environment import.
# Importing this session into the user's service manager would redirect KDE apps.
xwayland force
output HEADLESS-1 mode 1920x1080@60Hz
output * max_render_time off
input * events disabled
input "48879:57005:Keyboard_passthrough" events enabled
input "48879:57005:Mouse_passthrough" events enabled
input "48879:57005:Mouse_passthrough_(absolute)" events enabled
input "48879:57005:Touch_passthrough" events enabled
input "48879:57005:Pen_passthrough" events enabled
input "48879:57005:Mouse_passthrough" accel_profile flat
input "48879:57005:Mouse_passthrough_(absolute)" accel_profile flat
seat seat0 fallback true
bindsym Mod4+Return exec foot /bin/bash
bindsym Mod4+Shift+q kill
bindsym Mod4+f fullscreen toggle
bindsym Mod4+space floating toggle
bindsym Mod4+1 workspace 1
bindsym Mod4+2 workspace 2
bindsym Mod4+Shift+1 move container to workspace 1
bindsym Mod4+Shift+2 move container to workspace 2
exec "$HOME/.local/share/sunshine-headless/session.py" publish
# A visible initial window makes the Desktop entry useful without a launcher.
exec foot --title=Sunshine-Sway /bin/bash

# Optional desktop UI, installed and maintained independently.
include ~/.config/sway/dms.conf
